<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-hack desc-hack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title-hack">Illustratie van een terminalscherm met een slot</title>
  <desc id="desc-hack">Een donker terminalvenster met groene codelijnen en een oranje hangslot, symbool voor de hackingcontest.</desc>
  <rect width="480" height="360" rx="14" fill="#111B2E"/>
  <rect x="24" y="24" width="432" height="312" rx="10" fill="#0B1320" stroke="#22304A" stroke-width="2"/>
  <circle cx="52" cy="50" r="5" fill="#F2A93B"/>
  <circle cx="70" cy="50" r="5" fill="#34D9C5"/>
  <circle cx="88" cy="50" r="5" fill="#E7ECF3" opacity=".4"/>
  <g font-family="monospace" font-size="13" fill="#34D9C5">
    <text x="44" y="90">$ nmap -sV target.local</text>
    <text x="44" y="112" fill="#93A0B4">Scanning ports 1-1024 ...</text>
    <text x="44" y="134">22/tcp  open  ssh</text>
    <text x="44" y="156">80/tcp  open  http</text>
    <text x="44" y="178" fill="#F2A93B">443/tcp open  https</text>
    <text x="44" y="200" fill="#93A0B4"># capture the flag...</text>
  </g>
  <g transform="translate(300,190)">
    <rect x="-38" y="10" width="76" height="60" rx="8" fill="#F2A93B"/>
    <path d="M -22 10 v-20 a22 22 0 0 1 44 0 v20" fill="none" stroke="#F2A93B" stroke-width="10"/>
    <circle cx="0" cy="40" r="7" fill="#1a1200"/>
    <rect x="-3" y="42" width="6" height="16" fill="#1a1200"/>
  </g>
</svg>
