<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-git desc-git" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title-git">Illustratie van een git-branchdiagram</title>
  <desc id="desc-git">Een vertakkend diagram van commits en branches, verbonden door lijnen en cirkels, symbool voor Git en GitHub.</desc>
  <rect width="480" height="360" rx="14" fill="#111B2E"/>
  <g stroke="#22304A" stroke-width="2" fill="none">
    <path d="M120 60 V300"/>
    <path d="M120 150 C120 190, 280 190, 280 230 V300"/>
    <path d="M280 230 C280 190, 360 190, 360 220 V300"/>
  </g>
  <g fill="#34D9C5">
    <circle cx="120" cy="60" r="9"/>
    <circle cx="120" cy="150" r="9"/>
    <circle cx="120" cy="230" r="9"/>
    <circle cx="120" cy="300" r="9"/>
  </g>
  <g fill="#F2A93B">
    <circle cx="280" cy="230" r="9"/>
    <circle cx="280" cy="300" r="9"/>
  </g>
  <circle cx="360" cy="220" r="9" fill="#E7ECF3"/>
  <circle cx="360" cy="300" r="9" fill="#E7ECF3"/>
  <g font-family="monospace" font-size="12" fill="#93A0B4">
    <text x="140" y="64">main</text>
    <text x="140" y="154">commit</text>
    <text x="300" y="234">feature-branch</text>
    <text x="380" y="224">pull request</text>
  </g>
</svg>
